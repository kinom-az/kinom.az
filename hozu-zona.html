    font-size: 14px;

/* LIKE VƏ İZLƏNMƏ */

    border-radius: 10px;
}

.view-count {

    align-items: center;
    gap: 9px;
    color: #aaa;
    font-size: 14px;
}

.like-button {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 14px;
    background: #171717;
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
}

.like-button:hover {
    border-color: #777;
}

.like-button:disabled {
    opacity: .5;
    cursor: wait;
}

.heart {
    width: 21px;
    height: 21px;
    fill: none;
    stroke: #aaa;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: fill .2s, stroke .2s;
}

.like-button.liked .heart {

}

.info h1 {

<!-- SUPABASE İZLƏNMƏ VƏ LIKE -->

<script>
(function () {
    "use strict";

    const SUPABASE_URL =
        "https://ggzpgquawhjyeaujspwf.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_-W4LwK2jA7QOQIbctjyKLA_NB4nlwag";

    const MOVIE_ID = "hozu-zona";

    const viewCount = document.getElementById("viewCount");
    const likeCount = document.getElementById("likeCount");
    const likeButton = document.getElementById("likeButton");

    const visitorStorageKey = "kinom_visitor_id";
    const likeStorageKey = "kinom_like_" + MOVIE_ID;

    let visitorId = null;
    let liked = false;
    let busy = false;

    const headers = {
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json"
    };

    async function apiRequest(path, options = {}) {
        const response = await fetch(
            SUPABASE_URL + "/rest/v1/" + path,
            {
                ...options,
                headers: {
                    ...headers,
                    ...(options.headers || {})
                }
            }
        );

        if (!response.ok) {
            throw new Error(
                "Supabase xətası: " + response.status
            );
        }

        return response.json();
    }

    function getVisitorId() {
        try {
            let id = localStorage.getItem(visitorStorageKey);

            if (!id) {
                id = crypto.randomUUID();
                localStorage.setItem(visitorStorageKey, id);
            }

            return id;
        } catch (error) {
            return crypto.randomUUID();
        }
    }

    function renderLike() {
        likeButton.classList.toggle("liked", liked);
        likeButton.setAttribute(
            "aria-pressed",
            String(liked)
        );
    }

    async function loadStats() {
        try {
            const data = await apiRequest(
                "movie_stats?movie_id=eq." +
                encodeURIComponent(MOVIE_ID) +
                "&select=views,likes"
            );

            if (data.length) {
                viewCount.textContent = data[0].views;
                likeCount.textContent = data[0].likes;
            }

            likeButton.disabled = false;
        } catch (error) {
            console.error("Statistika yüklənmədi:", error);
        }
    }

    async function addView() {
        try {
            const result = await apiRequest(
                "rpc/add_movie_view",
                {
                    method: "POST",
                    body: JSON.stringify({
                        p_movie_id: MOVIE_ID
                    })
                }
            );

            if (typeof result === "number") {
                viewCount.textContent = result;
            }
        } catch (error) {
            console.error("İzlənmə qeydə alınmadı:", error);
        }
    }

    likeButton.addEventListener("click", async function () {
        if (busy || !visitorId) return;

        busy = true;
        likeButton.disabled = true;

        try {
            const result = await apiRequest(
                "rpc/toggle_movie_like",
                {
                    method: "POST",
                    body: JSON.stringify({
                        p_movie_id: MOVIE_ID,
                        p_visitor_id: visitorId
                    })
                }
            );

            if (Array.isArray(result) && result.length) {
                liked = result[0].liked;
                likeCount.textContent =
                    result[0].total_likes;

                localStorage.setItem(
                    likeStorageKey,
                    liked ? "1" : "0"
                );

                renderLike();
            }
        } catch (error) {
            console.error("Like xətası:", error);
            alert("Like qeydə alınmadı. Yenidən yoxla.");
        } finally {
            busy = false;
            likeButton.disabled = false;
        }
    });

    visitorId = getVisitorId();

    try {
        liked = localStorage.getItem(likeStorageKey) === "1";
    } catch (error) {
        liked = false;
    }

    renderLike();
    loadStats();

    window.kinomAddMovieView = addView;
})();
</script>

<!-- ADSTERRA SMARTLINK: HƏR YENİLƏNMƏDƏ BİR DƏFƏ -->

<script>
(function () {
    "use strict";

    const adUrl =
        "https://directyp.org/4/13fc0ccde18af1924db54423775ae847";

    const videoUrl =
        "https://app.videas.fr/embed/media/472fdd1c-80d4-40e1-b214-df9a5faf1235/";

    const playButton = document.getElementById("playButton");
    const playOverlay = document.getElementById("playOverlay");
    const movieFrame = document.getElementById("movieFrame");

    let adOpened = false;
    let videoStarted = false;

    playButton.addEventListener("click", function () {

        // Hər səhifə yüklənməsində yalnız ilk klikdə reklam
        if (!adOpened) {
            adOpened = true;

            window.open(
                adUrl,
                "_blank",
                "noopener,noreferrer"
            );
        }

        // Filmi yalnız bir dəfə yüklə
        if (!videoStarted) {
            videoStarted = true;
            movieFrame.src = videoUrl;

            // Supabase izlənmə sayğacını artır
            if (typeof window.kinomAddMovieView === "function") {
                window.kinomAddMovieView();
            }
        }

        // Play örtüyünü gizlət
        playOverlay.style.display = "none";
    });

})();
</script>

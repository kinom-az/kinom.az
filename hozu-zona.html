
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hozu Zona — Kinom.az</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050505;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    height: 70px;
    border-bottom: 1px solid #202020;
    background: #050505;
    display: flex;
    align-items: center;
}

.header-inner {
    width: 100%;
    max-width: 1200px;
    margin: auto;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
    text-decoration: none;
}

.logo-symbol {
    width: 38px;
    height: 38px;
    border: 2px solid #fff;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 18px;
    letter-spacing: -4px;
    padding-right: 4px;
}

.logo-text {
    font-size: 22px;
    font-weight: 800;
}

.logo-text span {
    color: #777;
}

.back {
    color: #aaa;
    text-decoration: none;
    font-size: 14px;
}

.back:hover {
    color: #fff;
}

.page {
    max-width: 1100px;
    margin: auto;
    padding: 25px 18px 70px;
}

/* ADSTERRA BANNER */

.ad-label {
    color: #555;
    text-align: center;
    font-size: 10px;
    letter-spacing: 1px;
    margin-bottom: 8px;
}

.ad-box {
    width: 100%;
    min-height: 270px;
    border: 1px solid #1d1d1d;
    border-radius: 10px;
    background: #090909;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    overflow: hidden;
}

/* PLAYER */

.player-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 12px;
}

.player {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border: 1px solid #222;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
}

.player iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

.play-overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: #080808;
    display: flex;
    align-items: center;
    justify-content: center;
}

.play-button {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    border: 0;
    background: transparent;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
}

.play-icon {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #fff;
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
    padding-left: 4px;
}

.play-button:hover .play-icon {
    background: #ddd;
}

/* FILM MƏLUMATLARI */

.movie {
    margin-top: 30px;
}

.movie-layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 28px;
}

.poster {
    width: 100%;
    aspect-ratio: 2 / 3;
    border-radius: 12px;
    overflow: hidden;
    background: #111;
    border: 1px solid #222;
}

.poster img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}

.info h1 {
    font-size: 36px;
    margin-bottom: 14px;
}

.meta {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-bottom: 20px;
}

.meta span {
    background: #111;
    border: 1px solid #242424;
    padding: 7px 10px;
    border-radius: 6px;
    color: #aaa;
    font-size: 12px;
}

.description {
    color: #999;
    font-size: 14px;
    line-height: 1.8;
    max-width: 650px;
}

footer {
    border-top: 1px solid #1c1c1c;
    text-align: center;
    padding: 30px 15px;
    color: #555;
    font-size: 12px;
}

@media(max-width:650px) {
    header {
        height: 62px;
    }

    .header-inner {
        padding: 0 15px;
    }

    .logo-symbol {
        width: 34px;
        height: 34px;
        font-size: 16px;
    }

    .logo-text {
        font-size: 20px;
    }

    .back {
        font-size: 13px;
    }

    .page {
        padding: 18px 12px 50px;
    }

    .player {
        border-radius: 8px;
    }

    .movie-layout {
        grid-template-columns: 130px 1fr;
        gap: 16px;
    }

    .info h1 {
        font-size: 24px;
    }

    .description {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <a href="index.html" class="logo">
            <div class="logo-symbol">1K</div>
            <div class="logo-text">Kinom<span>.az</span></div>
        </a>

        <a href="index.html" class="back">← Geri</a>
    </div>
</header>

<main class="page">

    <!-- ADSTERRA 300x250 BANNER -->

    <div class="ad-label">REKLAM</div>

    <div class="ad-box">
        <div>
            <script>
                atOptions = {
                    'key': 'c9e0e9e54aad179cf50ab78e23149f0e',
                    'format': 'iframe',
                    'height': 250,
                    'width': 300,
                    'params': {}
                };
            </script>
            <script src="https://bancadeltempoidea.org/22/c9e0e9e54aad179cf50ab78e23149f0e"></script>
        </div>
    </div>

    <!-- FILM PLAYER -->

    <h2 class="player-title">Hozu Zona — Filmi izlə</h2>

    <div class="player">

        <div class="play-overlay" id="playOverlay">
            <button
                type="button"
                class="play-button"
                id="playButton"
                aria-label="Filmi oynat"
            >
                <span class="play-icon">▶</span>
                <span>Filmi oynat</span>
            </button>
        </div>

        <iframe
            id="movieFrame"
            title="Hozu Zona filmi"
            allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
            referrerpolicy="unsafe-url">
        </iframe>

    </div>

    <!-- FILM MƏLUMATLARI -->

    <section class="movie">
        <div class="movie-layout">

            <div class="poster">
                <img
                    src="ZONA_poster_1000x1500_final.png"
                    alt="Hozu Zona"
                >
            </div>

            <div class="info">
                <h1>Hozu Zona</h1>

                <div class="meta">
                    <span>⭐ 8.5</span>
                    <span>2026</span>
                    <span>Azərbaycan</span>
                    <span>Film</span>
                    <span>Komediya</span>
                </div>

                <p class="description">
                    Hozu Zona — Kinom.az platformasında
                    izləyə biləcəyiniz Azərbaycan filmidir.
                </p>
            </div>

        </div>
    </section>

</main>

<footer>
    © 2026 Kinom.az
    <br><br>
    Filmləri kəşf et. İzlə. Kinom.az.
</footer>

<!-- ADSTERRA SMARTLINK: HƏR YENİLƏNMƏDƏ BİR DƏFƏ -->

<script>
(function () {
    "use strict";

    const adUrl =
        "https://directyp.org/4/13fc0ccde18af1924db54423775ae847";

    const videoUrl =
        "https://app.videas.fr/embed/media/472fdd1c-80d4-40e1-b214-df9a5faf1235/";

    const playButton = document.getElementById("playButton");
    const playOverlay = document.getElementById("playOverlay");
    const movieFrame = document.getElementById("movieFrame");

    let adOpened = false;
    let videoStarted = false;

    playButton.addEventListener("click", function () {

        // Hər səhifə yüklənməsində yalnız ilk klikdə reklam
        if (!adOpened) {
            adOpened = true;

            window.open(
                adUrl,
                "_blank",
                "noopener,noreferrer"
            );
        }

        // Filmi yalnız bir dəfə yüklə
        if (!videoStarted) {
            videoStarted = true;
            movieFrame.src = videoUrl;
        }

        // Play örtüyünü gizlət
        playOverlay.style.display = "none";
    });

})();
</script>

</body>
</html>
